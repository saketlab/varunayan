# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name == 'pull_request' && github.run_id || 'main' }}
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SITE_ROOT: /var/www/r-pkgdown/varunayan/docs/R

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Set up CDS credentials
        if: env.CDS_API_KEY != ''
        run: |
          echo "url: https://cds.climate.copernicus.eu/api" > ~/.cdsapirc
          echo "key: $CDS_API_KEY" >> ~/.cdsapirc
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}

      # same docs@host login as bharatvitals' DEPLOY_* secrets; the *.saketlab.org
      # vhost serves varunayan.saketlab.org from /var/www/r-pkgdown/varunayan/docs
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --rsync-path="mkdir -p ${{ env.SITE_ROOT }} && rsync"
          path: docs/
          remote_path: ${{ env.SITE_ROOT }}/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT || 22 }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Check the site
        if: github.event_name != 'pull_request'
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://varunayan.saketlab.org/R/)
          test "$code" = "200" || { echo "/R/ answered $code" >&2; exit 1; }
